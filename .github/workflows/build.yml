name: Build Notepad++ Plugin

# Builds NppProjectManager.dll on a hosted Windows runner — no local
# compiler needed on your own machine.
#
# - Every push/PR builds both x64 and Win32 (32-bit) DLLs and attaches them
#   to the workflow run as downloadable artifacts (Actions tab → the run →
#   "Artifacts" at the bottom).
# - Pushing a tag like "v1.0" additionally publishes both DLLs to a GitHub
#   Release, so you get a stable download link instead of digging through
#   Actions runs.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch: {}   # adds a manual "Run workflow" button in the Actions tab

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Configure (${{ matrix.arch }})
        run: cmake -S . -B build -A ${{ matrix.arch }}

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Locate built DLL
        id: locate
        shell: bash
        run: |
          dll=$(find build -iname "NppProjectManager.dll" | head -n1)
          if [ -z "$dll" ]; then
            echo "::error::NppProjectManager.dll not found under build/ — build must have failed silently."
            exit 1
          fi
          echo "Found: $dll"
          echo "dll_path=$dll" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NppProjectManager-${{ matrix.arch }}
          path: ${{ steps.locate.outputs.dll_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built DLLs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.dll
          generate_release_notes: true
